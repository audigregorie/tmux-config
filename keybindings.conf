## --- Key bindings ---
# Session Management
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."
# Session/window switchers with Claude status emoji (s, w, e)
# See claude-status.conf for details
# Switch to the previous session
unbind-key L                                          # Unbind default switch-client
bind-key J switch-client -l
bind-key X command-prompt -p 'kill session:' 'kill-session -t "%%"'
bind-key S command-prompt -p 'new session:' 'new-session -s "%%"'

# Window & Pane Creation
bind-key '\' split-window -h -c "#{pane_current_path}" -p 50
bind-key - split-window -v -c "#{pane_current_path}"
unbind-key l                                          # Unbind default last-window binding
bind-key j last-window

# Window Management
bind-key < swap-window -d -t -1
bind-key > swap-window -d -t +1

# Pane Navigation
bind-key h select-pane -L
bind-key l select-pane -R

# Pane Resizing
bind-key -r Left resize-pane -L 5
bind-key -r Down resize-pane -D 5
bind-key -r Up resize-pane -U 5
bind-key -r Right resize-pane -R 5
bind-key E select-layout even-horizontal

# Copy Mode Bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
# Keybinding prefix + [ enters copy move in commandline terminal

# Use { or } to jump up and down by vertical spaces
bind-key -T copy-mode-vi C-k send-keys -X previous-paragraph
bind-key -T copy-mode-vi C-j send-keys -X next-paragraph

## --- Key binding reference ---
# prefix+r   - Reload tmux config
# prefix+s   - Switch session (fzf popup with Claude status emoji)
# prefix+w   - Switch window (fzf popup with Claude status emoji)
# prefix+e   - Tree view of sessions and windows (choose-tree with emoji)
# prefix+S   - Create a new session (prompts for name, switches to it)
# prefix+X   - Kill a session by name (prompts for input)
# prefix+c   - New window (prompts name in synced sessions, otherwise default)
# prefix+,   - Rename current window
# prefix+$   - Rename current session
# prefix+x   - Kill current pane (with confirmation)
# prefix+\   - Split pane horizontally (side by side)
# prefix+-   - Split pane vertically (top and bottom)
# prefix+j   - Jump to last window
# prefix+J   - Jump to last session
# prefix+h   - Select pane to the left
# prefix+l   - Select pane to the right
# prefix+{   - Swap current pane with previous pane (tmux default)
# prefix+}   - Swap current pane with next pane (tmux default)
# prefix+<   - Move current window one position left
# prefix+>   - Move current window one position right
# prefix+n   - Next window (tmux default)
# prefix+p   - Previous window (tmux default)
# prefix+[   - Enter copy mode
# prefix+I   - Install TPM plugins
# prefix+Ctrl-s - Save tmux environment (resurrect)
# prefix+Ctrl-r - Restore tmux environment (resurrect)
#
# Copy mode (vi):
#   v     - Begin selection
#   C-v   - Toggle rectangle selection
#   y     - Copy selection and exit
#   C-k   - Previous paragraph
#   C-j   - Next paragraph
#
# Pane resizing (repeatable):
#   prefix+Left/Down/Up/Right - Resize by 5 cells
