# Core settings (prefix, performance, appearance, input)
source-file ~/.config/tmux/settings.conf

# Key bindings (navigation, splits, copy mode, resizing)
source-file ~/.config/tmux/keybindings.conf

# Synced session/window management (c, ,, $, x) and rename hooks
source-file ~/.config/tmux/sync-sessions.conf

# Claude Code status integration (emoji indicators in status bar, switchers, tree view)
source-file ~/.config/tmux/claude-status.conf

# Plugins, status bar, and continuum settings
source-file ~/.config/tmux/plugins.conf

# ==============================
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
