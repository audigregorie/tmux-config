## --- Settings ---
# Set tmux prefix key to Control + A
set -g prefix C-a
unbind C-b                                          # Unbind default prefix
bind-key C-a send-prefix                            # Send prefix to nested tmux sessions

# Performance settings
set -g escape-time 0                                # Eliminate delay for command sequences
set -g history-limit 10000                          # Reasonable history limit (reduced from 1,000,000)
set -sg focus-events on                             # For better Neovim integration
set -g status-interval 5                            # Update status bar every 5 seconds (default: 15)
set -g display-time 2000                            # Display messages for 2 seconds
set -g repeat-time 600                              # Repeat time for repeatable commands

# Appearance
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256color*:Tc"
set -g status-position bottom

# Window & pane settings
set -g base-index 1                                 # Start window numbering at 1
set -g pane-base-index 1                            # Start pane numbering at 1
set -g renumber-windows on                          # Renumber windows when one is closed
set -g allow-rename off                             # Disable automatic renaming
set -g detach-on-destroy off                        # Keep tmux running when last window closes
set -g pane-border-style fg='#444444'
set -g pane-active-border-style fg=orange        # (#00aff)

# Input settings
set -g mouse on                                     # Enable mouse support
set -g set-clipboard on                             # Enable clipboard integration
set-window-option -g mode-keys vi                   # Vi style keys
set-window-option -g status-keys vi

## --- Key bindings ---
# Session Management
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."
# Opens the tree with sessions collapsed (expand with right arrow)
bind-key s choose-tree -Z -s 
# Opens the tree with sessions expanded, showing all windows immediately
bind-key w choose-tree -Z -w 
# Switch to the previous session
bind-key B switch-client -l

# Window & Pane Creation
bind-key c new-window -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}" -p 45
bind-key - split-window -v -c "#{pane_current_path}"
unbind-key l                                          # Unbind default last-window binding
bind-key b last-window                                # Map last-window to k (Ctrl+a k)

# Window Management
bind-key < swap-window -t -1
bind-key > swap-window -t +1

# Pane Navigation
bind-key h select-pane -L
bind-key l select-pane -R

# Pane Resizing
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Copy Mode Bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
# Keybinding prefix + [ enters copy move in commandline terminal

# Use { or } to jump up and down by vertical spaces
bind-key -T copy-mode-vi C-k send-keys -X previous-paragraph
bind-key -T copy-mode-vi C-j send-keys -X next-paragraph

## --- Plugins ---
# Install plugins with Prefix key + I
set -g @plugin 'tmux-plugins/tpm' # Set up tmux plugin manager
set -g @plugin 'christoomey/vim-tmux-navigator'     # Seamless vim/tmux navigation
set -g @plugin 'tmux-plugins/tmux-yank'             # Enhanced copy mode
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'        # Auto-save and auto-restore sessions

# Continuum settings - automatically restore sessions on tmux start
set -g @continuum-restore 'on'                       # Auto-restore last saved environment
set -g @continuum-save-interval '15'                # Save every 15 minutes

# Resurrect keybindings (provided by tmux-resurrect plugin):
#   Ctrl+a Ctrl-s  - Manually save current tmux environment
#   Ctrl+a Ctrl-r  - Manually restore last saved tmux environment
# Note: Continuum automatically saves every 15 minutes and restores on tmux start

## --- Status bar ---
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g window-status-current-format  "#[fg=orange][#[default]#I:#W#F#[fg=orange]]#[default]"
set -g window-status-current-format  "#[fg=orange]#I:#W#F#[default]"
# set -g status-style 'bg=#2b2b2b'
set -g status-style 'bg=#121212'
# set -g status-left ' #S | '                    # Show full session name
set -g status-left ' [#S]  '                    # Show full session name
set -g status-left-length 0                 # Unlimited length for session name (0 = unlimited)
set -g status-right '#{battery_status_bg} #[fg=#1d90f5]#{battery_percentage}#[default]  %a %d-%h %H:%M'


