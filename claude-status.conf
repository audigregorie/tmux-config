# Claude Code status integration for tmux
# Shows ⚡️ (working), 🔔 (needs input), or ✅ (done) per window/session
# Requires: ~/scripts/claude-tmux-status.sh (hook script)
#           ~/scripts/claude-tmux-window-status.sh (emoji aggregator)
#           ~/.claude/settings.json hooks (UserPromptSubmit, PreToolUse, etc.)

# --- Status bar emoji per window ---
set -g window-status-current-format  "#[fg=#d67656]#(~/scripts/claude-tmux-window-status.sh '#S:#I')#I:#W#F#[default] "
set -g window-status-format  "#(~/scripts/claude-tmux-window-status.sh '#S:#I')#I:#W#F "

# --- Session switcher (prefix+s) — fzf with emoji ---
bind-key s display-popup -E 'cur=$(tmux display-message -p "#S"); last=$(tmux display-message -p "#{client_last_session}"); tmux list-sessions -F "#S" | while IFS= read -r line; do st=$(~/scripts/claude-tmux-window-status.sh "$line"); label="$line"; [ -n "$st" ] && label="$st $line"; if [ "$line" = "$cur" ]; then printf "\033[38;2;214;118;86m%s\033[0m\n" "$label"; elif [ "$line" = "$last" ]; then printf "\033[38;2;136;136;136m%s\033[0m\n" "$label"; else printf "%s\n" "$label"; fi; done | fzf --ansi --reverse | sed "s/^⚡️ //; s/^✅ //; s/^🔔 //" | xargs tmux switch-client -t'

# --- Window switcher (prefix+w) — fzf with emoji ---
bind-key w display-popup -E 'sess=$(tmux display-message -p "#S"); tmux list-windows -F "#{window_active} #{window_last_flag} #I:#W" | while IFS= read -r line; do active=${line%% *}; rest=${line#* }; last=${rest%% *}; entry=${rest#* }; idx=${entry%%:*}; st=$(~/scripts/claude-tmux-window-status.sh "$sess:$idx"); label="$entry"; [ -n "$st" ] && label="$st $entry"; if [ "$active" = "1" ]; then printf "\033[38;2;214;118;86m%s\033[0m\n" "$label"; elif [ "$last" = "1" ]; then printf "\033[38;2;136;136;136m%s\033[0m\n" "$label"; else printf "%s\n" "$label"; fi; done | fzf --ansi --reverse | sed "s/^⚡️ //; s/^✅ //; s/^🔔 //" | cut -d: -f1 | xargs tmux select-window -t'

# --- Tree view (prefix+e) — choose-tree with emoji ---
bind-key e choose-tree -Zw -F '#(~/scripts/claude-tmux-window-status.sh "#{session_name}:#{window_index}") #{window_index}:#{window_name}#{window_flags} #(git -C "#{pane_current_path}" branch --show-current 2>/dev/null)'

# --- Cleanup stale status files when panes close ---
set-hook -g pane-died 'run-shell "rm -f /tmp/claude-tmux-status/#{pane_id}"'
set-hook -g pane-exited 'run-shell "rm -f /tmp/claude-tmux-status/#{pane_id}"'
