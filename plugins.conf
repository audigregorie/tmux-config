## --- Plugins ---
# Install plugins with Prefix key + I
set -g @plugin 'tmux-plugins/tpm'                    # Tmux plugin manager
set -g @plugin 'christoomey/vim-tmux-navigator'      # Seamless vim/tmux navigation
set -g @plugin 'tmux-plugins/tmux-yank'              # Enhanced copy mode
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # Auto-save and auto-restore sessions

# Continuum settings - automatically restore sessions on tmux start
set -g @continuum-restore 'on'                       # Auto-restore last saved environment
set -g @continuum-save-interval '15'                 # Save every 15 minutes

# Resurrect keybindings (provided by tmux-resurrect plugin):
#   Ctrl+a Ctrl-s  - Manually save current tmux environment
#   Ctrl+a Ctrl-r  - Manually restore last saved tmux environment
# Note: Continuum automatically saves every 15 minutes and restores on tmux start

