# Synced session/window management for 1-server and 2-claude sessions
# Creates/renames windows via sync scripts when in synced sessions,
# falls back to default tmux behavior otherwise.
# Requires: ~/scripts/sync-new-window.sh
#           ~/scripts/sync-rename-window.sh

# --- New window (prefix+c) ---
bind-key c if-shell \
  "tmux display-message -p '#S' | grep -qE '^(1-server|2-claude)$'" \
  "command-prompt -p 'window name:' \"run-shell '~/scripts/sync-new-window.sh \\\"%1\\\"'\"" \
  "new-window -a -c '#{pane_current_path}'"

# --- Rename window (prefix+,) ---
bind-key , set -g message-style 'bg=#444444' \; if-shell \
  "tmux display-message -p '#S' | grep -qE '^(1-server|2-claude)$'" \
  "command-prompt -I '#W' -p 'rename window:' \"run-shell '~/scripts/sync-rename-window.sh #{session_name} #{window_index} \\\"%1\\\"'\"" \
  "command-prompt -I '#W' \"rename-window -- '%%'\""

# --- Rename session (prefix+$) ---
bind-key '$' set -g message-style 'bg=#444444' \; command-prompt -I '#S' "rename-session -- '%%'"

# --- Kill pane (prefix+x) ---
bind-key x confirm-before -p 'kill-pane #P? (y/n)' kill-pane

# Reset message style after rename completes
set-hook -g after-rename-window 'set -g message-style default'
set-hook -g after-rename-session 'set -g message-style default'
